[project]
name = "onboarding-demo"
version = "0.1.0"
description = "Business customer onboarding agent built on Amazon Bedrock AgentCore (reference implementation)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "httpx==0.28.1",
    "boto3==1.43.96",
    "bedrock-agentcore==1.23.1",
    "playwright==1.63.0",
    "strands-agents==1.56.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]
# Only inside the AgentCore Runtime container: sends traces to AgentCore Observability.
runtime = ["aws-opentelemetry-distro==0.19.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onboarding_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: runs against a real AWS account (skipped unless --live is passed)"]
